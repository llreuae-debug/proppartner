<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 480" width="100%" height="100%" fill="none">
  <defs>
    <!-- Navy / Deep Blue Gradients -->
    <linearGradient id="ppNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194C88" />
      <stop offset="100%" stop-color="#0E2F5E" />
    </linearGradient>

    <!-- Emerald / Teal Green Gradients -->
    <linearGradient id="ppTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24A37A" />
      <stop offset="100%" stop-color="#146E52" />
    </linearGradient>

    <!-- Center Building Split Gradient -->
    <linearGradient id="ppCenterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A82" />
      <stop offset="100%" stop-color="#0A2447" />
    </linearGradient>
    <linearGradient id="ppCenterRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#229D76" />
      <stop offset="100%" stop-color="#105C44" />
    </linearGradient>
  </defs>

  <g transform="translate(50, 20)">
    <!-- 1. BACKGROUND BUILDINGS -->
    <!-- Left Building -->
    <path d="M185 240 L185 140 L220 120 L220 240 Z" fill="url(#ppNavyGrad)" />
    <!-- Left Building White Facet Line -->
    <path d="M220 120 L240 108 L240 240 L220 240 Z" fill="#2965A8" opacity="0.9" />

    <!-- Center Tall Skyscraper -->
    <!-- Left Facet -->
    <path d="M240 70 L250 50 L250 240 L240 240 Z" fill="url(#ppCenterLeft)" />
    <!-- Right Facet -->
    <path d="M250 50 L260 70 L285 70 L285 240 L250 240 Z" fill="url(#ppCenterRight)" />

    <!-- Right Building -->
    <path d="M285 130 L310 150 L310 240 L285 240 Z" fill="url(#ppTealGrad)" />
    <path d="M310 150 L325 162 L325 240 L310 240 Z" fill="#136048" />
    <!-- Right Building Windows -->
    <rect x="292" y="165" width="10" height="12" rx="1.5" fill="#FFFFFF" opacity="0.9" />
    <rect x="292" y="185" width="10" height="12" rx="1.5" fill="#FFFFFF" opacity="0.9" />

    <!-- 2. INTERLOCKING PARTNERS & CHAIN LINK EMBLEM -->
    <!-- Left Partner Head -->
    <circle cx="150" cy="180" r="26" fill="url(#ppNavyGrad)" />

    <!-- Right Partner Head -->
    <circle cx="350" cy="180" r="26" fill="url(#ppTealGrad)" />

    <!-- Left Partner Loop Body (Navy) -->
    <path d="M180 180 C180 180 235 230 260 255 C275 270 265 295 245 305 C220 318 175 310 150 270 C135 245 140 205 165 185 C172 180 180 180 180 180 Z" 
          fill="none" stroke="url(#ppNavyGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Partner Loop Body (Teal) -->
    <path d="M320 180 C320 180 265 230 240 255 C225 270 235 295 255 305 C280 318 325 310 350 270 C365 245 360 205 335 185 C328 180 320 180 320 180 Z" 
          fill="none" stroke="url(#ppTealGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interlocking Center Connection -->
    <path d="M225 220 L275 270" stroke="url(#ppNavyGrad)" stroke-width="26" stroke-linecap="round" />
    <path d="M275 220 L225 270" stroke="url(#ppTealGrad)" stroke-width="26" stroke-linecap="round" />

    <!-- 3. TYPOGRAPHY: PropPartner -->
    <!-- Prop (Navy) -->
    <text x="35" y="380" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="#14437B">Prop</text>

    <!-- Partner (Emerald Green) -->
    <text x="188" y="380" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="64" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="#1E936E">Partner</text>

    <!-- 4. SUBTITLE: — Connect. Refer. Earn. — -->
    <!-- Left Accent Line -->
    <line x1="40" y1="418" x2="90" y2="418" stroke="#14437B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Text -->
    <text x="105" y="425" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="22" 
          font-weight="600" 
          letter-spacing="0.04em" 
          fill="#1E293B">Connect. Refer. Earn.</text>

    <!-- Right Accent Line -->
    <line x1="410" y1="418" x2="460" y2="418" stroke="#14437B" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
