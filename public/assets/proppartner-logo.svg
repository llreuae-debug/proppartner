<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sapphire / Navy Blue 3D Gradients -->
    <linearGradient id="ppNavyDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="60%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="ppNavyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Emerald / Teal Green 3D Gradients -->
    <linearGradient id="ppEmeraldDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="ppEmeraldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Center Spire Split Gradients -->
    <linearGradient id="ppCenterNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="ppCenterEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Text Gradients for Dark Background Contrast -->
    <linearGradient id="ppTextBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#93C5FD" />
    </linearGradient>

    <linearGradient id="ppTextGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="ppShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- ==================== 1. 3D SKYSCRAPERS EMBLEM ==================== -->
  <g id="skyscrapers-group" filter="url(#ppShadow)">
    <!-- LEFT BUILDING (Navy) -->
    <!-- Front Face -->
    <path d="M210 220 L210 135 L245 110 L245 220 Z" fill="url(#ppNavyDeep)" />
    <!-- 3D Bevel / Light Edge -->
    <path d="M245 110 L260 98 L260 220 L245 220 Z" fill="url(#ppNavyLight)" opacity="0.95" />

    <!-- CENTER TALL TOWER (Diamond Point Spire) -->
    <!-- Left Facet (Navy) -->
    <path d="M260 68 L270 42 L270 220 L260 220 Z" fill="url(#ppCenterNavy)" />
    <!-- Right Facet (Emerald) -->
    <path d="M270 42 L280 68 L308 68 L308 220 L270 220 Z" fill="url(#ppCenterEmerald)" />
    <!-- Center Ridge Highlight -->
    <line x1="270" y1="42" x2="270" y2="220" stroke="#93C5FD" stroke-width="1.2" opacity="0.6" />

    <!-- RIGHT BUILDING (Emerald Green) -->
    <!-- Front Face -->
    <path d="M308 120 L336 142 L336 220 L308 220 Z" fill="url(#ppEmeraldDeep)" />
    <!-- Side Shadow Face -->
    <path d="M336 142 L350 152 L350 220 L336 220 Z" fill="url(#ppEmeraldDark)" />
    <!-- Architectural Windows -->
    <rect x="314" y="152" width="12" height="13" rx="2" fill="#E2E8F0" opacity="0.9" />
    <rect x="314" y="172" width="12" height="13" rx="2" fill="#E2E8F0" opacity="0.9" />
  </g>

  <!-- ==================== 2. INTERLOCKING PARTNERS & CHAIN LINK ==================== -->
  <g id="interlocking-partners-group" filter="url(#ppShadow)">
    <!-- Left Partner Head -->
    <circle cx="178" cy="168" r="26" fill="url(#ppNavyDeep)" stroke="#3B82F6" stroke-width="1.5" />

    <!-- Right Partner Head -->
    <circle cx="362" cy="168" r="26" fill="url(#ppEmeraldDeep)" stroke="#34D399" stroke-width="1.5" />

    <!-- Left Partner Loop Body (Navy) -->
    <path d="M206 172 C206 172 258 220 280 242 C295 258 285 284 266 295 C242 308 198 300 174 260 C160 236 166 196 192 176 C198 172 206 172 206 172 Z" 
          fill="none" stroke="url(#ppNavyDeep)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Partner Loop Body (Emerald Green) -->
    <path d="M334 172 C334 172 282 220 260 242 C245 258 255 284 274 295 C298 308 342 300 366 260 C380 236 374 196 348 176 C342 172 334 172 334 172 Z" 
          fill="none" stroke="url(#ppEmeraldDeep)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interlocking Center Handshake Connection -->
    <!-- Navy Loop Overpass -->
    <path d="M246 208 L294 256" stroke="url(#ppNavyDeep)" stroke-width="26" stroke-linecap="round" />
    <!-- Emerald Loop Underpass with 3D Depth Layering -->
    <path d="M294 208 L268 234" stroke="url(#ppEmeraldDeep)" stroke-width="26" stroke-linecap="round" />
    <path d="M252 250 L246 256" stroke="url(#ppEmeraldDeep)" stroke-width="26" stroke-linecap="round" />
  </g>

  <!-- ==================== 3. BRAND TYPOGRAPHY: PropPartner ==================== -->
  <g id="brand-text-group">
    <!-- "Prop" (Sapphire Blue / Clean Light Blue for Dark Theme) -->
    <text x="75" y="358" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="url(#ppTextBlue)">Prop</text>

    <!-- "Partner" (Vibrant Emerald Green) -->
    <text x="228" y="358" 
          font-family="'Plus Jakarta Sans', 'Inter', 'Montserrat', -apple-system, sans-serif" 
          font-size="62" 
          font-weight="800" 
          letter-spacing="-0.02em" 
          fill="url(#ppTextGreen)">Partner</text>

    <!-- ==================== 4. TAGLINE: — Connect. Refer. Earn. — ==================== -->
    <!-- Left Accent Line -->
    <line x1="82" y1="388" x2="135" y2="388" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" />

    <!-- Tagline Text -->
    <text x="150" y="394" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="18" 
          font-weight="700" 
          letter-spacing="0.08em" 
          fill="#CBD5E1">Connect. Refer. Earn.</text>

    <!-- Right Accent Line -->
    <line x1="425" y1="388" x2="478" y2="388" stroke="#10B981" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
