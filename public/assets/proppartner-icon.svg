<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Navy / Deep Blue Gradients -->
    <linearGradient id="iconNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E5496" />
      <stop offset="100%" stop-color="#0E2F5E" />
    </linearGradient>

    <!-- Emerald / Teal Green Gradients -->
    <linearGradient id="iconTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24A37A" />
      <stop offset="100%" stop-color="#146E52" />
    </linearGradient>

    <linearGradient id="iconCenterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A4A82" />
      <stop offset="100%" stop-color="#0A2447" />
    </linearGradient>
    <linearGradient id="iconCenterRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#229D76" />
      <stop offset="100%" stop-color="#105C44" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 10)">
    <!-- Left Building -->
    <path d="M135 240 L135 140 L170 120 L170 240 Z" fill="url(#iconNavy)" />
    <path d="M170 120 L190 108 L190 240 L170 240 Z" fill="#2965A8" opacity="0.9" />

    <!-- Center Tall Skyscraper -->
    <path d="M190 70 L200 50 L200 240 L190 240 Z" fill="url(#iconCenterLeft)" />
    <path d="M200 50 L210 70 L235 70 L235 240 L200 240 Z" fill="url(#iconCenterRight)" />

    <!-- Right Building -->
    <path d="M235 130 L260 150 L260 240 L235 240 Z" fill="url(#iconTeal)" />
    <path d="M260 150 L275 162 L275 240 L260 240 Z" fill="#136048" />
    <!-- Windows -->
    <rect x="242" y="165" width="10" height="12" rx="1.5" fill="#FFFFFF" opacity="0.9" />
    <rect x="242" y="185" width="10" height="12" rx="1.5" fill="#FFFFFF" opacity="0.9" />

    <!-- Left Partner Head -->
    <circle cx="100" cy="180" r="26" fill="url(#iconNavy)" />

    <!-- Right Partner Head -->
    <circle cx="300" cy="180" r="26" fill="url(#iconTeal)" />

    <!-- Left Loop Body -->
    <path d="M130 180 C130 180 185 230 210 255 C225 270 215 295 195 305 C170 318 125 310 100 270 C85 245 90 205 115 185 C122 180 130 180 130 180 Z" 
          fill="none" stroke="url(#iconNavy)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Loop Body -->
    <path d="M270 180 C270 180 215 230 190 255 C175 270 185 295 205 305 C230 318 275 310 300 270 C315 245 310 205 285 185 C278 180 270 180 270 180 Z" 
          fill="none" stroke="url(#iconTeal)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Interlocking Center Connection -->
    <path d="M175 220 L225 270" stroke="url(#iconNavy)" stroke-width="26" stroke-linecap="round" />
    <path d="M225 220 L175 270" stroke="url(#iconTeal)" stroke-width="26" stroke-linecap="round" />
  </g>
</svg>
